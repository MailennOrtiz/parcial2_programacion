# Opcional: levanta un PostgreSQL para este proyecto.
# Si ya hay un PostgreSQL instalado en la máquina, no hace falta: alcanza con
# apuntar DATABASE_URL (en el archivo .env) a ese servidor.
#
# Acá no hay ninguna contraseña escrita: se toma de la variable
# POSTGRES_PASSWORD del archivo .env. Si falta, docker compose se niega a
# arrancar y avisa por qué.

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: db_capitulo4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-capitulo4_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-capitulo4_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
